<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      Окно работает только с локальными файлами сборки: сеть закрыта (connect-src),
      запросы к API идут из main-процесса. 'unsafe-inline' нужен HMR-преамбуле Vite.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*"
    />
    <title>Низкий профиль — CRM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
